[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rigmetry"
version = "0.1.0"
description = "AI Agent Harness를 잠그고 재생하며 동일 예산에서 비교하는 실험 엔진"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rigmetry 기여자" }]
keywords = ["ai-agent", "harness", "evaluation", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
rigmetry = "rigmetry.cli:app"

[project.urls]
Homepage = "https://github.com/JH-9568/rigmetry"
Repository = "https://github.com/JH-9568/rigmetry"
Issues = "https://github.com/JH-9568/rigmetry/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
