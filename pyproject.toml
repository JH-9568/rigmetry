[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openharness"
version = "0.1.0"
description = "재현 가능한 AI Agent 실행과 평가를 위한 Harness-as-Code Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "OpenHarness 기여자" }]
keywords = ["ai-agent", "harness", "evaluation", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
openharness = "openharness.cli:app"

[project.urls]
Homepage = "https://github.com/JH-9568/openharness"
Repository = "https://github.com/JH-9568/openharness"
Issues = "https://github.com/JH-9568/openharness/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
