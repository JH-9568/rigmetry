# 목표 인터페이스를 보여주는 예시이며 반복 실행 기능은 아직 구현되지 않았습니다.
id: debugging-skill-effect
task: ../tasks/example.yaml

variants:
  baseline: ../harnesses/basic.yaml
  candidate: ../harnesses/basic-with-debugging.yaml

controls:
  require_same:
    - task
    - harness.model
    - harness.mcps
    - harness.tools
    - harness.system_prompt
    - harness.runtime
  allow_diff:
    - harness.skills

trials:
  count: 5
  order: randomized
  seed: 9568

metrics:
  - success_rate
  - total_tokens
  - steps
  - duration
