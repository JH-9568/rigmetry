name: 버그 수정
description: 재현 가능한 Rigmetry 결함을 보고합니다
title: "[버그] "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: 실제 동작
      description: 실제로 발생한 동작과 필요한 경우 정확한 오류를 작성하세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 문제를 재현하는 최소 명령, Config 또는 테스트를 작성하고 Secret은 제거하세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 수정 전 실패하고 수정 후 통과하는 회귀 테스트를 추가한다
        - [ ] 기존 테스트가 통과한다
        - [ ] 관련 문서를 갱신한다
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위, 의존 관계, 제외 범위
      description: 예상 수정 모듈, 관련 Issue, 후속 작업을 작성하세요.
    validations:
      required: true
