name: CI

"on":
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7

      - name: Python 설정
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Package 설치
        run: python -m pip install -e ".[dev]"

      - name: Ruff 검사
        run: ruff check .

      - name: 테스트
        run: pytest
